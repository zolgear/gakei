# ADR-0021: v* タグの push で動く。linux/amd64 で起動確認をしてから、
# linux/amd64 + linux/arm64 のマルチアーキテクチャで GHCR に push し、
# GitHub Release を作る。CI(ci.yml)の docker ジョブは変えない(単一アーキテクチャのまま)。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # GitHub Release の作成
  packages: write   # GHCR への push

# タグごと。走りかけの release を打ち切ると中途半端な公開状態になりかねないので cancel しない。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: タグとバージョンの一致を確認
        id: version
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("backend/pyproject.toml", "rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME}"
          # プレリリース(vX.Y.Z-rc.N)は、これから出す X.Y.Z の候補なので、`-` の前だけを
          # pyproject.toml と比べる(pyproject.toml は PEP 440 なので `-rc.N` を書けない)。
          if [[ "$tag" == *-* ]]; then
            prerelease=true
            base="${tag%%-*}"
          else
            prerelease=false
            base="$tag"
          fi
          if [ "$base" != "v${version}" ]; then
            echo "タグ ${tag} が backend/pyproject.toml の version(${version})と一致しません" >&2
            echo "タグは v${version}(プレリリースなら v${version}-rc.N)にするか、pyproject.toml の version を上げてから打ち直してください" >&2
            exit 1
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >>"$GITHUB_OUTPUT"

      - name: QEMU のセットアップ
        uses: docker/setup-qemu-action@v3

      - name: Buildx のセットアップ
        uses: docker/setup-buildx-action@v3

      - name: GHCR にログイン
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: イメージのメタデータ(タグ・ラベル)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.licenses=Apache-2.0

      - name: イメージのビルド(linux/amd64、起動確認用)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: gakei:release-test
          build-args: |
            GAKEI_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: FAKE_PROVIDER=1 で起動
        run: |
          docker run -d --name gakei-release-test -e FAKE_PROVIDER=1 -p 127.0.0.1:8798:8000 gakei:release-test

      - name: /api/capabilities が応答するまで待つ
        run: |
          set -euo pipefail
          ok=0
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8798/api/capabilities >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "コンテナが時間内に起動しませんでした" >&2
            exit 1
          fi

      - name: / が SPA の index.html を返すことを確認
        run: |
          set -euo pipefail
          body="$(curl -sf http://127.0.0.1:8798/)"
          if ! printf '%s' "$body" | grep -qF '<title>GAKEI</title>'; then
            echo "/ のレスポンスに <title>GAKEI</title> が含まれていません" >&2
            exit 1
          fi

      - name: コンテナのログ(失敗時)
        if: failure()
        run: docker logs gakei-release-test || true

      - name: 起動確認用コンテナの後片付け
        if: always()
        run: docker rm -f gakei-release-test || true

      - name: 第三者ライセンス表記を取り出す
        run: |
          set -euo pipefail
          docker run --rm gakei:release-test python -m app.tools.third_party_notices - >THIRD_PARTY_NOTICES.txt
          test -s THIRD_PARTY_NOTICES.txt

      - name: イメージのビルドと push(linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GAKEI_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub Release を作成
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" THIRD_PARTY_NOTICES.txt
