[project]
name = "gakei-backend"
version = "0.4.0"
description = "GAKEI ローカルMVP バックエンド"
license = "Apache-2.0"
authors = [
    { name = "Toru Suzuki", email = "zolgear@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "pillow>=10.4",
    "python-multipart>=0.0.9",
    "openai>=3.16.2",
    "httpx>=0.28.1",
    "websockets>=17.1",
    "cbor2>=6.1.4",
    "authlib>=1.3",
    "itsdangerous>=2.2",
    "mcp>=2.2",
    "onnxruntime>=1.30.0",
    "numpy>=2.5.3",
    "psycopg[binary]>=3.2",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
    "boto3>=1.35",
    "sentencepiece>=0.2.2",
    "pgvector>=0.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "pytest-xdist>=3.8.0",
    "moto[s3,server]>=5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI の Depends/Query/File/Form はデフォルト引数として使うのが正しい書き方なので B008 の対象外にする。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 登録していないマーカー(綴りの誤りなど)をエラーにする。
addopts = ["--strict-markers"]
markers = [
    "windows: OS の違いが出るテスト。Windows の CI で dev への push ごとに回す(ADR-0012)",
]
